[project]
name = "firstmate"
version = "0.0.1"
description = "First Mate daemon — local autonomous coding-workflow orchestrator"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
fm-spike = "firstmate.spike.relay:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firstmate"]
