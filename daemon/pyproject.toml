[project]
name = "firstmate"
version = "0.0.1"
description = "First Mate daemon — local autonomous coding-workflow orchestrator"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "websockets>=12"]

[project.scripts]
fm = "firstmate.cli:main"
fm-spike = "firstmate.spike.relay:main"
fm-smoke = "firstmate.smoke:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firstmate"]
