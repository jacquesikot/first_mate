<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First Mate</title>
<style>
:root{
  --ink:#0E0F13; --panel:#14161B; --panel-2:#191C22; --line:#23262E; --line-2:#2E323C;
  --fg:#C9CCD6; --dim:#7C8090; --faint:#4A4F5C; --ghost:#343945;
  --amber:#D9A441; --amber-dim:#8A6A2C;
  --green:#6FA96B; --red:#C4706F; --warm:#C4703F;
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Menlo",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:1px solid var(--amber);outline-offset:2px}

/* shell */
.shell{display:grid;grid-template-columns:184px 1fr;min-height:100vh}
.rail{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.brand{padding:16px 16px 14px;border-bottom:1px solid var(--line)}
.brand h1{font-size:14px;font-weight:500;letter-spacing:.01em}
.brand .sub{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:2px}
.nav{padding:8px 8px;flex:1}
.nav button{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:6px;color:var(--dim);font-size:13px;text-align:left}
.nav button:hover{background:var(--panel-2);color:var(--fg)}
.nav button.on{background:var(--panel-2);color:var(--fg);box-shadow:inset 2px 0 0 var(--amber)}
.nav .count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}
.nav .count.alert{color:var(--amber)}
.rail-foot{padding:10px 16px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--faint)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px;vertical-align:middle}

/* main */
.main{display:flex;flex-direction:column;min-width:0}
.topbar{height:44px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.topbar h2{font-size:14px;font-weight:500}
.topbar .meta{font-family:var(--mono);font-size:11px;color:var(--faint)}
.alertpill{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--amber);border:1px solid var(--amber-dim);padding:2px 8px;border-radius:99px}
.alertpill:hover{background:#2A2113}
.view{padding:22px 24px;overflow-y:auto;flex:1}
.wrap{max-width:1180px;margin:0 auto}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;margin:0 0 8px}

/* task rows */
.group{margin-bottom:22px}
.trow{display:grid;grid-template-columns:16px 1fr 176px 92px 92px;gap:12px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:6px;cursor:pointer;text-align:left;width:100%}
.trow:hover{border-color:var(--line-2);background:var(--panel-2)}
.trow.attn{border-left:2px solid var(--amber);padding-left:11px}
.glyph{font-family:var(--mono);font-size:13px;text-align:center}
.g-run{color:var(--green)} .g-block{color:var(--amber)} .g-done{color:var(--green)}
.g-fail{color:var(--red)} .g-idle{color:var(--faint)}
.tgoal{font-size:13.5px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsub{display:block;font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:3px}
.tstep{font-family:var(--mono);font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tage{font-family:var(--mono);font-size:11px;color:var(--faint);text-align:right}
.qbadge{font-family:var(--mono);font-size:11px;color:var(--amber);text-align:right}

/* context meter */
.meter{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--dim)}
.bar{width:54px;height:3px;background:var(--ghost);border-radius:2px;overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:var(--dim)}
.bar.hot i{background:var(--warm)}
.meter.hot{color:var(--warm)}

/* generation rail — signature element */
.rail-gen{display:flex;align-items:center;gap:0;margin:10px 0 2px}
.gen{position:relative;height:22px;border:1px solid var(--line-2);border-radius:3px;background:var(--panel-2);overflow:hidden;flex:1}
.gen i{position:absolute;inset:0 auto 0 0;background:#242833;border-right:1px solid #3B404C}
.gen span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;color:var(--dim)}
.gen.live{border-color:var(--amber-dim)}
.gen.live i{background:#2E2415;border-right-color:var(--amber-dim)}
.gen.live span{color:var(--amber)}
.handoff{width:22px;flex:none;text-align:center;font-family:var(--mono);font-size:11px;color:var(--faint)}

/* panels & detail */
.split{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.card{border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:14px}
.card h3{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:400;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.card h3 .r{margin-left:auto;color:var(--ghost);text-transform:none;letter-spacing:0}
.card .body{padding:12px 14px}
.tabs{display:flex;gap:2px;padding:0 8px;border-bottom:1px solid var(--line)}
.tabs button{padding:9px 10px;font-size:12.5px;color:var(--faint);border-bottom:1px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--dim)}
.tabs button.on{color:var(--fg);border-bottom-color:var(--amber)}

.crit{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.crit:last-child{border-bottom:none}
.crit .m{font-family:var(--mono);font-size:12px;flex:none;width:14px}
.crit .txt{font-size:13px;color:var(--fg)}
.crit .ev{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:2px}
.ok{color:var(--green)} .no{color:var(--red)} .pend{color:var(--faint)}

.step{padding:12px 14px;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:none}
.step .hd{display:flex;align-items:baseline;gap:9px}
.step .nm{font-family:var(--mono);font-size:12.5px;color:var(--fg)}
.step .st{font-family:var(--mono);font-size:11px;margin-left:auto}
.handoff-note{font-size:12.5px;color:var(--dim);background:var(--panel-2);border-left:2px solid var(--ghost);padding:8px 11px;border-radius:0 4px 4px 0;margin-top:8px}
.handoff-note b{color:var(--dim);font-weight:500;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:4px;color:var(--faint)}

pre.term{font-family:var(--mono);font-size:11.5px;line-height:1.65;color:var(--dim);white-space:pre-wrap;margin:0}
pre.term .c{color:var(--green)}
pre.diff{font-family:var(--mono);font-size:11.5px;line-height:1.6;margin:0;white-space:pre}
pre.diff .a{color:var(--green)} pre.diff .d{color:var(--red)} pre.diff .h{color:var(--faint)}
.fileline{display:flex;gap:8px;padding:4px 0;font-family:var(--mono);font-size:12px;cursor:pointer}
.fileline:hover .fn{color:#fff}
.fileline .fm{width:12px} .fileline .fn{color:var(--fg)} .fileline .fd{color:var(--faint)}

/* inbox */
.q{border:1px solid var(--line);border-left:2px solid var(--amber);border-radius:0 8px 8px 0;background:var(--panel);margin-bottom:12px}
.q .qh{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--faint)}
.qtype{color:var(--amber);text-transform:uppercase;letter-spacing:.1em}
.q .qb{padding:13px 14px}
.q .qtext{font-size:14px;color:var(--fg);margin-bottom:4px}
.q .qev{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-bottom:12px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1px solid var(--line-2);border-radius:6px;padding:6px 12px;font-size:12.5px;color:var(--dim)}
.opt:hover{border-color:var(--amber-dim);color:var(--amber);background:#221C10}
.opt.primary{border-color:var(--amber-dim);color:var(--amber)}
.qmeta{font-family:var(--mono);font-size:11px;color:var(--ghost);margin-top:10px}
.answered{opacity:.45;border-left-color:var(--ghost)}
.q.info{border-left-color:var(--ghost)}

/* memory */
.memline{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.memline:last-child{border:none}
.memline .dt{font-family:var(--mono);font-size:11px;color:var(--faint);flex:none;width:72px}
.promote{border:1px dashed var(--line-2);border-radius:8px;padding:12px 14px;margin-bottom:12px;background:var(--panel)}

/* scoping chat */
.chat{max-width:760px}
.msg{margin-bottom:16px}
.msg .who{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.msg.you .who{color:var(--amber-dim)}
.msg p{font-size:14px;color:var(--fg);margin-bottom:8px}
.msg ul{margin:0 0 8px 18px;font-size:13.5px;color:var(--dim)}
.msg li{margin-bottom:3px}
.contract-prev{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:14px;font-family:var(--mono);font-size:12px;color:var(--dim);white-space:pre-wrap;line-height:1.7}
.composer{display:flex;gap:8px;margin-top:20px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel);padding:10px 12px}
.composer input{flex:1;background:none;border:none;color:var(--fg);font:inherit}
.composer input::placeholder{color:var(--ghost)}
.send{color:var(--amber);font-family:var(--mono);font-size:12px}

.empty{color:var(--faint);font-size:13px;padding:26px 0;text-align:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--panel-2);border:1px solid var(--line-2);border-left:2px solid var(--amber);border-radius:6px;padding:9px 15px;font-size:13px;opacity:0;transition:.25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:900px){.shell{grid-template-columns:64px 1fr}.brand h1,.brand .sub,.nav span.lbl,.rail-foot{display:none}.split{grid-template-columns:1fr}.trow{grid-template-columns:16px 1fr 90px}.trow .tstep,.trow .tage{display:none}}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand"><h1>First Mate</h1><div class="sub">localhost:7717</div></div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot"><span class="dot"></span>daemon up · 3h12m</div>
  </aside>
  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="view" id="view"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const DB = {
  tasks: [
    { id:"t_a1e5", goal:"Fix relevance scoring coverage gaps in ENG-529", project:"reach-platform",
      branch:"eng-529-scoring", state:"running", step:"implement · phase 2", age:"1h04m",
      ctx:62, gen:2, questions:0,
      steps:[
        {name:"plan", status:"done", gens:[{pct:38,live:false}], note:"3 phases identified; wrote plan.md"},
        {name:"implement", status:"running", gens:[{pct:100,live:false},{pct:62,live:true}],
         handoff:"Phase 1–2 complete. relevance_score_version column added with migration + rollback; breakdown.ts written and exported. Phase 3 (backfill migration for existing rows) remains. Gotcha: searchDemand.ts imports scoreKeyword in two places — both updated, but the second is inside a Temporal activity and needs a workflow version bump."},
        {name:"review", status:"pending", gens:[]}
      ],
      criteria:[
        {t:"relevance_score_version column exists with migration + rollback", s:"ok", ev:"supabase/migrations/0142 · applied locally"},
        {t:"scoreKeyword returns breakdown for v2 and v3 paths", s:"ok", ev:"pnpm test scoring → 14/14"},
        {t:"2 new tests cover version dispatch", s:"ok", ev:"scoring.test.ts +2"},
        {t:"backfill migration for existing rows", s:"pend", ev:"phase 3 — not started"},
        {t:"no changes outside src/scoring, supabase/migrations, src/workflows", s:"ok", ev:"git diff --stat · 4 files"}
      ],
      files:[{m:"M",n:"relevance.ts",d:"src/scoring"},{m:"A",n:"breakdown.ts",d:"src/scoring"},
             {m:"M",n:"0142_score_version.sql",d:"supabase/migrations"},{m:"M",n:"searchDemand.ts",d:"src/workflows"}],
      term:"⏺ Read src/workflows/searchDemand.ts\n⏺ Edit searchDemand.ts — updated second scoreKeyword call site\n⏺ Bash: pnpm test scoring\n  ✓ 14 passed (2 new)\n⏺ Writing phase 3 backfill migration…\n▌ working" },

    { id:"t_c3a7", goal:"Add Framer adapter to the publishing engine", project:"reach-platform",
      branch:"publish-framer", state:"blocked", step:"implement · phase 1", age:"42m",
      ctx:89, gen:1, questions:1,
      steps:[{name:"plan",status:"done",gens:[{pct:44,live:false}],note:"adapter spec approved"},
             {name:"implement",status:"blocked",gens:[{pct:89,live:true}]}],
      criteria:[{t:"FramerAdapter implements the shared spec interface",s:"ok",ev:"src/adapters/framer.ts"},
                {t:"round-trip publish verified in Playwright",s:"pend",ev:"blocked on auth question"},
                {t:"webflow + wordpress adapters unchanged",s:"ok",ev:"git diff --stat"}],
      files:[{m:"A",n:"framer.ts",d:"src/adapters"},{m:"M",n:"spec.md",d:"src/adapters"}],
      term:"⏺ Implemented FramerAdapter.publish()\n⏺ Playwright: navigating to Framer auth…\n⏺ Blocked — no test credentials in env\n⏺ fm ask --type decision (parked)\n▌ session parked, context handed off" },

    { id:"t_d4b8", goal:"Layer model: correct feed-cost curve by cycle", project:"kima-tools",
      branch:"fertigation-v6", state:"done", step:"review · complete", age:"3h30m",
      ctx:30, gen:1, questions:0,
      steps:[{name:"plan",status:"done",gens:[{pct:22,live:false}]},
             {name:"implement",status:"done",gens:[{pct:57,live:false}]},
             {name:"review",status:"done",gens:[{pct:30,live:false}],note:"2 findings, both fixed"}],
      criteria:[{t:"feed cost scales per cycle week, not flat",s:"ok",ev:"pytest models → 8/8"},
                {t:"depreciation counted once",s:"ok",ev:"pytest models"},
                {t:"24-month output reconciles to within ₦1",s:"ok",ev:"reconcile.py → pass"}],
      files:[{m:"M",n:"layer_model.py",d:"models"}],
      term:"✓ Review complete. 2 findings raised and fixed.\n✓ All criteria pass. Branch ready to merge." },

    { id:"t_f012", goal:"Transcribe and package the August ABSC session", project:"absc",
      branch:"absc-aug-wk3", state:"ready", step:"not started", age:"12m",
      ctx:0, gen:0, questions:0, steps:[], criteria:[], files:[], term:"" }
  ],
  questions: [
    { id:"q_7f2", task:"t_c3a7", taskGoal:"Add Framer adapter to the publishing engine", type:"decision",
      urgency:"blocking", age:"38m",
      text:"Framer's publish API needs authenticated credentials to round-trip test. No test account exists in the env.",
      evidence:"src/adapters/framer.ts:71 · playwright/publish.spec.ts",
      options:["Use my Framer account (I'll add creds)","Mock the API for now","Skip round-trip, unit tests only"] },
    { id:"q_9c1", task:"t_a1e5", taskGoal:"Fix relevance scoring coverage gaps in ENG-529", type:"scope_change",
      urgency:"blocking", age:"6m",
      text:"searchDemand.ts calls scoreKeyword inside a Temporal activity. Updating it needs a workflow version bump, which is outside the declared scope.",
      evidence:"src/workflows/searchDemand.ts:88 · blocked by scope guard",
      options:["Yes, bump the version","No, leave it and I'll handle separately","Stop, let's rethink the scope"] },
    { id:"q_4b8", task:"t_d4b8", taskGoal:"Layer model: correct feed-cost curve", type:"fyi",
      urgency:"info", age:"2h10m",
      text:"Assumed 18-week pullet phase (matches your last two models). Proceeded on that basis.",
      evidence:"models/layer_model.py:44", options:["Noted","That's wrong — flag it"] }
  ],
  memory: {
    "reach-platform":[
      {d:"Aug 14",t:"Temporal workflow changes always need a version bump — non-negotiable, breaks replays otherwise."},
      {d:"Aug 11",t:"Migrations live in supabase/migrations with a numeric prefix; always ship a rollback in the same file."},
      {d:"Aug 02",t:"pnpm, never npm. Test filter syntax is `pnpm test <name>`."},
      {d:"Jul 28",t:"Relevance scoring is versioned — never change v2 behaviour, add a v3 path instead."}
    ],
    "kima-tools":[
      {d:"Aug 09",t:"Financial models must reconcile to the naira; a rounding drift means a double-count somewhere."},
      {d:"Jul 30",t:"Layer cycles are 18 weeks pullet + 72 weeks lay. Don't use generic poultry defaults."}
    ]
  },
  promote:{q:"Temporal workflow changes need a version bump", asked:3, project:"reach-platform"}
};

let route={view:"tasks",task:null,tab:"steps"}, answered={};

const glyph = s => ({running:["●","g-run"],blocked:["◐","g-block"],done:["✓","g-done"],
  failed:["✗","g-fail"],ready:["○","g-idle"]}[s]||["○","g-idle"]);
const openQs = () => DB.questions.filter(q=>!answered[q.id]);
const blockingQs = () => openQs().filter(q=>q.urgency==="blocking");
const esc = s => s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function meter(pct){
  if(!pct) return `<div class="meter"><span style="color:var(--ghost)">—</span></div>`;
  const hot = pct>=85;
  return `<div class="meter ${hot?'hot':''}"><div class="bar ${hot?'hot':''}"><i style="width:${pct}%"></i></div>${pct}%</div>`;
}

function nav(){
  const items=[["tasks","Tasks",DB.tasks.filter(t=>t.state!=="done").length,false],
               ["inbox","Inbox",openQs().length,blockingQs().length>0],
               ["memory","Memory","",false],["new","New task","",false]];
  document.getElementById("nav").innerHTML = items.map(([k,l,c,alert])=>
    `<button class="${route.view===k?'on':''}" onclick="go('${k}')">
       <span class="lbl">${l}</span>${c!==""?`<span class="count ${alert?'alert':''}">${c}</span>`:""}</button>`).join("");
}

function topbar(){
  const b=blockingQs().length;
  const pill = b?`<button class="alertpill" onclick="go('inbox')">⚠ ${b} need${b>1?'':'s'} you</button>`:
                  `<span class="alertpill" style="color:var(--faint);border-color:var(--line)">nothing needs you</span>`;
  const t = route.task && DB.tasks.find(x=>x.id===route.task);
  const title = {tasks:"Tasks",inbox:"Inbox",memory:"Memory",new:"New task",
                 detail:t?esc(t.goal):"Task"}[route.view];
  const meta = route.view==="detail"&&t ? `<span class="meta">${t.id} · ${t.project} · ${t.branch}</span>`
    : route.view==="tasks" ? `<span class="meta">${DB.tasks.length} tasks · ${DB.tasks.filter(t=>t.state==="running").length} running</span>` : "";
  document.getElementById("topbar").innerHTML =
    (route.view==="detail"?`<button class="meta" onclick="go('tasks')">← tasks</button>`:"")+
    `<h2>${title}</h2>${meta}${pill}`;
}

function viewTasks(){
  const order=["running","blocked","ready","done"];
  const label={running:"Running",blocked:"Blocked — waiting on you",ready:"Ready to run",done:"Done"};
  return order.map(st=>{
    const rows=DB.tasks.filter(t=>t.state===st); if(!rows.length) return "";
    return `<section class="group"><p class="eyebrow">${label[st]}</p>` + rows.map(t=>{
      const [g,cls]=glyph(t.state);
      const q=t.state==="done"?0:openQs().filter(x=>x.task===t.id&&x.urgency==="blocking").length;
      return `<button class="trow ${t.state==='blocked'?'attn':''}" onclick="openTask('${t.id}')">
        <span class="glyph ${cls}">${g}</span>
        <span><span class="tgoal">${esc(t.goal)}</span>
          <span class="tsub">${t.project} · ${t.branch}${t.gen>1?` · gen ${t.gen}`:""}</span></span>
        <span class="tstep">${t.step}</span>
        ${meter(t.ctx)}
        <span class="${q?'qbadge':'tage'}">${q?`${q} question${q>1?'s':''}`:t.age}</span>
      </button>`;}).join("")+`</section>`;
  }).join("");
}

function genRail(step){
  if(!step.gens.length) return "";
  return `<div class="rail-gen">`+step.gens.map((g,i)=>
    (i?`<span class="handoff" title="context relay handoff">→</span>`:"")+
    `<span class="gen ${g.live?'live':''}"><i style="width:${g.pct}%"></i>
       <span>gen ${i+1} · ${g.pct}%${g.live?" · live":""}</span></span>`).join("")+`</div>`;
}

function viewDetail(){
  const t=DB.tasks.find(x=>x.id===route.task);
  const tabs=["steps","contract","changes","output"];
  const tabBody={
    steps: `<div>${t.steps.length?t.steps.map(s=>{
        const c={done:"var(--green)",running:"var(--amber)",blocked:"var(--amber)",pending:"var(--faint)"}[s.status];
        return `<div class="step"><div class="hd"><span class="nm">${s.name}</span>
          <span class="st" style="color:${c}">${s.status}</span></div>
          ${genRail(s)}
          ${s.handoff?`<div class="handoff-note"><b>handoff → gen ${s.gens.length}</b>${esc(s.handoff)}</div>`:""}
          ${s.note?`<div class="tsub" style="margin-top:6px">${esc(s.note)}</div>`:""}
        </div>`;}).join(""):`<p class="empty">Not started. Run this task to begin.</p>`}</div>`,
    contract: `<div class="body">${t.criteria.length?t.criteria.map(c=>{
        const m={ok:["✓","ok"],no:["✗","no"],pend:["○","pend"]}[c.s];
        return `<div class="crit"><span class="m ${m[1]}">${m[0]}</span>
          <span><span class="txt">${esc(c.t)}</span><div class="ev">${esc(c.ev)}</div></span></div>`;
      }).join(""):`<p class="empty">No contract yet.</p>`}</div>`,
    changes: `<div class="body">${t.files.length?t.files.map(f=>
        `<div class="fileline"><span class="fm ${f.m==='A'?'ok':'',f.m==='M'?'':''}" style="color:${f.m==='A'?'var(--green)':'var(--amber)'}">${f.m}</span>
         <span class="fn">${f.n}</span><span class="fd">${f.d}</span></div>`).join("")+
        `<pre class="diff" style="margin-top:12px"><span class="h">@@ scoreKeyword()</span>
<span class="d">-  return score(base)</span>
<span class="a">+  const version = versionFor(run)</span>
<span class="a">+  return { score: score(base, version), breakdown }</span></pre>`
        :`<p class="empty">No changes yet.</p>`}</div>`,
    output: `<div class="body">${t.term?`<pre class="term">${esc(t.term)}</pre>
        <div class="qmeta">read-only stream · attach with <span style="color:var(--dim)">fm attach ${t.id}</span></div>`
        :`<p class="empty">No live session.</p>`}</div>`
  };
  const qs=openQs().filter(q=>q.task===t.id);
  return `<div class="split"><div>
      <div class="card"><div class="tabs">${tabs.map(x=>
        `<button class="${route.tab===x?'on':''}" onclick="tab('${x}')">${x}</button>`).join("")}</div>
        ${tabBody[route.tab]}</div></div>
    <div>
      ${qs.length?`<div class="card" style="border-left:2px solid var(--amber)">
        <h3 style="color:var(--amber)">needs you<span class="r">${qs.length}</span></h3>
        <div class="body"><div class="qtext" style="font-size:13.5px">${esc(qs[0].text)}</div>
        <div class="opts" style="margin-top:10px">${qs[0].options.map((o,i)=>
          `<button class="opt ${i===0?'primary':''}" onclick="answer('${qs[0].id}','${esc(o)}')">${esc(o)}</button>`).join("")}</div>
        </div></div>`:""}
      <div class="card"><h3>state<span class="r">${t.id}</span></h3><div class="body">
        <div class="crit"><span class="m pend">·</span><span><span class="txt mono" style="font-size:12.5px">${t.state}</span><div class="ev">${t.step}</div></span></div>
        <div class="crit"><span class="m pend">·</span><span><span class="txt mono" style="font-size:12.5px">${t.gen?`generation ${t.gen}`:"not started"}</span><div class="ev">${t.gen>1?"1 context relay handoff":"no handoffs"}</div></span></div>
        <div class="crit"><span class="m pend">·</span><span>${meter(t.ctx)}<div class="ev">live session context</div></span></div>
      </div></div>
      <div class="card"><h3>worktree</h3><div class="body">
        <div class="ev mono" style="font-size:11.5px;color:var(--dim)">~/code/${t.project}-worktrees/${t.branch}</div>
        <div class="qmeta" style="margin-top:8px">fm attach ${t.id}</div>
      </div></div>
    </div></div>`;
}

function viewInbox(){
  const qs=DB.questions;
  if(!openQs().length) return `<p class="empty">Nothing needs you. Everything is running or done.</p>`;
  return qs.map(q=>{
    const done=answered[q.id];
    const info=q.urgency!=="blocking";
    return `<div class="q ${done?'answered':''} ${info?'info':''}">
      <div class="qh"><span class="qtype" style="${q.urgency!=='blocking'?'color:var(--faint)':''}">${q.type.replace("_"," ")}</span>
        <span>${esc(q.taskGoal)}</span><span style="margin-left:auto">${q.age} ago</span></div>
      <div class="qb"><div class="qtext">${esc(q.text)}</div><div class="qev">${esc(q.evidence)}</div>
        ${done?`<div class="qmeta">answered: ${esc(done)} · contract amended</div>`
        :`<div class="opts">${q.options.map((o,i)=>
            `<button class="opt ${i===0?'primary':''}" onclick="answer('${q.id}','${esc(o)}')">${esc(o)}</button>`).join("")}</div>
          <div class="qmeta">${info?"logged only · didn't interrupt the run"
             :`also sent to Slack · defaults to "${esc(q.options[q.options.length-1])}" in 8h`}</div>`}
      </div></div>`;}).join("");
}

function viewMemory(){
  const p=DB.promote;
  return `<div class="promote"><p class="eyebrow">Promote to memory?</p>
      <div style="font-size:13.5px">“${esc(p.q)}” — you've answered this ${p.asked} times across tasks in ${p.project}.</div>
      <div class="opts" style="margin-top:11px">
        <button class="opt primary" onclick="toast('Added to ${p.project} memory')">Add to memory</button>
        <button class="opt" onclick="toast('Dismissed')">Keep asking</button></div></div>`+
    Object.entries(DB.memory).map(([proj,lines])=>
      `<div class="card"><h3>${proj}<span class="r">${lines.length} entries</span></h3><div class="body">
        ${lines.map(l=>`<div class="memline"><span class="dt">${l.d}</span><span>${esc(l.t)}</span></div>`).join("")}
      </div></div>`).join("");
}

function viewNew(){
  return `<div class="chat">
    <div class="msg you"><div class="who">you</div><p>Fix the relevance scoring coverage gaps in ENG-529</p></div>
    <div class="msg"><div class="who">first mate</div>
      <p>Read the Linear issue and reach-platform memory. Here's the scope I'd propose — tell me what's wrong with it.</p>
      <p style="color:var(--dim);font-size:13px">Four completion criteria, all mechanically checkable:</p>
      <ul>
        <li><code class="mono">relevance_score_version</code> column with migration + rollback</li>
        <li>scoreKeyword returns a breakdown on both v2 and v3 paths</li>
        <li>Two new tests covering version dispatch</li>
        <li>Nothing changes outside src/scoring and supabase/migrations</li>
      </ul>
      <p style="color:var(--dim);font-size:13px">Steps: plan → implement (2 phases) → review. From memory: v2 behaviour must not change, and migrations ship with a rollback in the same file.</p>
    </div>
    <div class="msg you"><div class="who">you</div><p>Good, but src/workflows may need touching too — searchDemand imports it.</p></div>
    <div class="msg"><div class="who">first mate</div>
      <p>Added src/workflows to scope. Memory says Temporal changes need a workflow version bump, so I've made that a fifth criterion rather than a surprise later. Contract's ready:</p>
      <div class="contract-prev">goal      Fix relevance scoring coverage gaps (ENG-529)
scope     src/scoring/**, supabase/migrations/**, src/workflows/**
out       everything else — guard blocks writes, agent must ask
criteria  5 checks · 4 command-verified, 1 diff-constrained
steps     plan → implement ×2 → review
memory    4 entries injected from reach-platform</div>
      <div class="opts" style="margin-top:14px">
        <button class="opt primary" onclick="toast('Task t_a1e5 created and queued')">Approve and run</button>
        <button class="opt" onclick="toast('Opened for editing')">Edit contract</button></div>
    </div>
    <div class="composer"><input placeholder="Push back, add a constraint, or approve…"><button class="send">send ↵</button></div>
  </div>`;
}

function render(){
  nav(); topbar();
  const v={tasks:viewTasks,detail:viewDetail,inbox:viewInbox,memory:viewMemory,new:viewNew}[route.view];
  document.getElementById("view").innerHTML=`<div class="wrap">${v()}</div>`;
}
function go(v){route.view=v;route.task=null;render();window.scrollTo(0,0)}
function openTask(id){route.view="detail";route.task=id;route.tab="steps";render()}
function tab(t){route.tab=t;render()}
function answer(id,choice){
  answered[id]=choice;
  const q=DB.questions.find(x=>x.id===id);
  const t=DB.tasks.find(x=>x.id===q.task);
  if(t&&t.state==="blocked"){t.state="running";t.step="implement · phase 1";}
  toast(`Answered · ${t?t.id+" resumed":"recorded"}`);
  render();
}
let tid;
function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg; el.classList.add("show");
  clearTimeout(tid); tid=setTimeout(()=>el.classList.remove("show"),2600);
}
render();
</script>
</body>
</html>
